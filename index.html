<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
  <title>Field Shift</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1d2327; color: #e8ecef; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    #unity-canvas { display: block; width: 100%; height: 100%; background: #1d2327; outline: none; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
    #loading h1 { margin: 0; font-size: 30px; letter-spacing: 2px; }
    #loading p { margin: 0; color: #9aa6ad; font-size: 14px; }
    #bar { width: 260px; height: 8px; background: #3a4349; border-radius: 4px; overflow: hidden; }
    #fill { width: 0; height: 100%; background: #8fbf6a; transition: width 0.2s; }
    #error { max-width: 520px; text-align: center; color: #f5a07a; font-size: 14px; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">
    <h1>FIELD SHIFT</h1>
    <p>Farming in British Columbia with real NASA data</p>
    <div id="bar"><div id="fill"></div></div>
    <div id="error"></div>
  </div>
  <script src="Build/WebGL.loader.js"></script>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    createUnityInstance(canvas, {
      dataUrl: "Build/WebGL.data.unityweb",
      frameworkUrl: "Build/WebGL.framework.js.unityweb",
      codeUrl: "Build/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Field Shift team",
      productName: "Field Shift",
      productVersion: "0.1.0",
      // one game pixel per CSS pixel: high-DPI screens would otherwise make the GPU draw 2-4 times as many
      devicePixelRatio: 1,
    }, (progress) => {
      document.querySelector("#fill").style.width = (100 * progress) + "%";
    }).then(() => {
      document.querySelector("#loading").remove();
      canvas.focus();
    }).catch((message) => {
      document.querySelector("#error").textContent = "Could not start the game: " + message;
    });
  </script>
</body>
</html>
